services:
  postgres:
    image: postgres:17-alpine
    container_name: bwa-tasks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bwa
      POSTGRES_PASSWORD: bwa
      POSTGRES_DB: bwa_tasks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bwa -d bwa_tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
