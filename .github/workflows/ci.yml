name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bwa
          POSTGRES_PASSWORD: bwa
          POSTGRES_DB: bwa_tasks_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bwa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bwa:bwa@localhost:5433/bwa_tasks_test?schema=public
      TEST_DATABASE_URL: postgresql://bwa:bwa@localhost:5433/bwa_tasks_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - run: npm test
      - run: npm run test:e2e
