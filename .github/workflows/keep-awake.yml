# Render's free instances stop after 15 minutes without traffic and take about a
# minute to come back, which is a poor first impression for anyone opening the
# demo link. A request every ten minutes keeps the API warm.
#
# Delete this workflow once the services move to a paid plan.
name: Keep the demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl --fail --silent --show-error --max-time 90 "${{ vars.DEMO_API_URL }}/api/health"
